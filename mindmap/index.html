<!DOCTYPE html>
<!--
  MeterSphere 用例脑图查看器
  启动方式：python scripts/mindmap_server.py --open
  单文件：所有 CSS 和 JS 均内联，无外部依赖
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeterSphere 脑图</title>
<style>
/* ── Reset & 基础 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F6FA; color: #262626; user-select: none; }

/* ── 布局骨架 ── */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── Header ── */
#header {
  height: 56px; min-height: 56px;
  background: #fff;
  border-bottom: 1px solid #E8E8E8;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
#header .logo { font-size: 15px; font-weight: 600; color: #1d1d1f; white-space: nowrap; }
#header .spacer { flex: 1; }
#btn-toggle-sidebar {
  width: 32px; height: 32px; border-radius: 6px;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #595959;
  transition: background 0.15s;
}
#btn-toggle-sidebar:hover { background: #F0F0F0; }

/* 项目选择器 */
#project-select {
  height: 32px; padding: 0 10px;
  border: 1px solid #D9D9D9; border-radius: 6px;
  background: #fff; font-size: 13px; color: #262626;
  cursor: pointer; outline: none;
  transition: border-color 0.15s;
}
#project-select:focus { border-color: #4096FF; }

/* Header 按钮 */
.hbtn {
  height: 32px; padding: 0 14px;
  border-radius: 6px; border: 1px solid #D9D9D9;
  background: #fff; font-size: 13px; color: #262626;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: border-color 0.15s, background 0.15s;
  white-space: nowrap;
}
.hbtn:hover { border-color: #4096FF; color: #4096FF; }
.hbtn.primary { background: #4096FF; border-color: #4096FF; color: #fff; }
.hbtn.primary:hover { background: #1677FF; border-color: #1677FF; }

/* ── 内容区 ── */
#content { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: 260px; min-width: 260px;
  background: #fff;
  border-right: 1px solid #E8E8E8;
  display: flex; flex-direction: column;
  transition: width 0.25s ease, min-width 0.25s ease;
  overflow: hidden;
}
#sidebar.collapsed { width: 0; min-width: 0; border-right: none; }

#sidebar-inner { width: 260px; display: flex; flex-direction: column; height: 100%; }

#sidebar-header {
  padding: 12px 14px 8px;
  font-size: 12px; font-weight: 600; color: #8C8C8C;
  letter-spacing: 0.5px; text-transform: uppercase;
  border-bottom: 1px solid #F0F0F0;
  white-space: nowrap;
}

#module-tree {
  flex: 1; overflow-y: auto; padding: 6px 0;
}
#module-tree::-webkit-scrollbar { width: 4px; }
#module-tree::-webkit-scrollbar-thumb { background: #D9D9D9; border-radius: 2px; }

/* 模块树节点 */
.tree-node { }
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  cursor: pointer; font-size: 13px; color: #262626;
  border-radius: 0;
  transition: background 0.12s;
  white-space: nowrap; overflow: hidden;
}
.tree-item:hover { background: #F5F6FA; }
.tree-item.active { background: #E6F4FF; color: #1677FF; font-weight: 500; }
.tree-item .toggle {
  font-size: 10px; color: #BFBFBF;
  width: 14px; text-align: center; flex-shrink: 0;
  transition: transform 0.15s;
}
.tree-item.expanded .toggle { transform: rotate(90deg); }
.tree-item .node-name {
  flex: 1; overflow: hidden; text-overflow: ellipsis;
}
.tree-children { display: none; }
.tree-children.open { display: block; }

/* 空状态 */
.empty-tip { padding: 24px 14px; font-size: 13px; color: #BFBFBF; text-align: center; }

/* ── 主画布区 ── */
#main {
  flex: 1; overflow: hidden; position: relative;
  background: #F5F6FA;
}

/* 加载 spinner */
#loading {
  display: none; position: absolute; inset: 0;
  background: rgba(245,246,250,0.8);
  z-index: 50; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #E0E0E0;
  border-top-color: #4096FF;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-text { font-size: 13px; color: #8C8C8C; }

/* 错误提示 */
#error-panel {
  display: none; position: absolute; inset: 0;
  background: rgba(245,246,250,0.9);
  z-index: 50; align-items: center; justify-content: center;
}
#error-panel.show { display: flex; }
#error-box {
  background: #fff; border: 1px solid #FFB3B3;
  border-radius: 10px; padding: 24px 32px;
  text-align: center; max-width: 400px;
}
#error-box .err-icon { font-size: 32px; margin-bottom: 12px; }
#error-box .err-msg { font-size: 14px; color: #FF4D4F; margin-bottom: 16px; }
#btn-retry {
  padding: 6px 20px; border-radius: 6px;
  background: #FF4D4F; border: none; color: #fff;
  font-size: 13px; cursor: pointer;
}
#btn-retry:hover { background: #CF1322; }

/* 空画布提示 */
#canvas-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  color: #BFBFBF; font-size: 14px; pointer-events: none;
}
#canvas-placeholder .ph-icon { font-size: 48px; }

/* 画布容器（可滚动） */
#canvas-scroll {
  width: 100%; height: 100%;
  overflow: auto; cursor: grab;
  position: relative;
}
#canvas-scroll.grabbing { cursor: grabbing; }
#canvas-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
#canvas-scroll::-webkit-scrollbar-thumb { background: #D9D9D9; border-radius: 3px; }

/* SVG 画布 */
#mindmap-svg {
  display: block;
  transform-origin: 0 0;
  transition: transform 0.1s;
}

/* ── 节点样式 ── */
/* 用例根节点 */
.node-case-rect {
  fill: #fff;
  stroke: #4096FF;
  stroke-width: 2;
  rx: 8;
}
/* 优先级徽章（圆形） */
.badge-p0 { fill: #FF4D4F; }
.badge-p1 { fill: #FA8C16; }
.badge-p2 { fill: #1890FF; }
.badge-p3 { fill: #8C8C8C; }
.badge-text { fill: #fff; font-size: 11px; font-weight: 700; }

/* 其他节点背景（hover 高亮） */
.node-bg { fill: transparent; }
.node-bg:hover { fill: rgba(64,150,255,0.06); }

/* 文字 */
.node-text {
  font-size: 13px; fill: #262626;
  dominant-baseline: middle;
}
.node-text-case { font-size: 13px; fill: #262626; font-weight: 500; }

/* 内联 badge（文字后面的彩色标签） */
/* 用 foreignObject 或纯 SVG rect+text */

/* 连接线 */
.conn-line {
  stroke: #4096FF;
  stroke-width: 1.5;
  fill: none;
  opacity: 0.5;
}

/* Tooltip */
#tooltip {
  position: fixed; z-index: 9999;
  background: rgba(0,0,0,0.82); color: #fff;
  font-size: 12px; line-height: 1.5;
  padding: 6px 10px; border-radius: 6px;
  max-width: 320px; word-break: break-all;
  pointer-events: none;
  display: none;
}

/* 全屏按钮激活态 */
.hbtn.fullscreen-active { background: #E6F4FF; border-color: #4096FF; color: #4096FF; }

/* 缩放提示 */
#zoom-hint {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(0,0,0,0.5); color: #fff;
  font-size: 12px; padding: 4px 10px; border-radius: 20px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
#zoom-hint.show { opacity: 1; }

/* ── 嵌入模式（embedded=1）── */
body.embedded #header { display: none; }
body.embedded #sidebar { display: none !important; }
body.embedded #btn-toggle-sidebar { display: none; }
body.embedded #main { margin-left: 0 !important; }

/* 自动刷新指示器 */
#refresh-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #52C41A; display: inline-block;
  margin-right: 4px; opacity: 0;
  transition: opacity 0.3s;
}
#refresh-dot.pulse { animation: pulse-dot 1s ease; }
@keyframes pulse-dot {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* 折叠按钮：默认隐藏，hover 用例节点时显示 */
.collapse-btn { opacity: 0; transition: opacity 0.15s; }
.collapse-btn.expanded { opacity: 1; }   /* 已折叠状态常显 */
.collapse-btn circle { transition: fill 0.15s; }

/* 选中节点高亮 */
.node-selected > rect[data-hover] {
  fill: rgba(64,150,255,0.08) !important;
  stroke: #4096FF !important;
  stroke-width: 1.5 !important;
}

/* 节点右侧 ＋ 按钮（选中后才显示） */
.node-add-btn { display: none; cursor: pointer; }
.node-selected ~ .node-add-btn,
.node-add-btn.visible { display: inline; }

/* 内联编辑框 */
.inline-editor {
  box-shadow: 0 2px 12px rgba(64,150,255,0.25);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* 自定义确认弹窗 */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.35); align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 8px; padding: 24px; width: 360px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.modal-box .modal-icon { text-align: center; margin-bottom: 12px; font-size: 36px; }
.modal-box .modal-msg { text-align: center; font-size: 14px; color: #333; line-height: 1.6; margin-bottom: 20px; }
.modal-box .modal-actions { display: flex; justify-content: center; gap: 12px; }
.modal-box .modal-btn {
  padding: 6px 24px; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid #D9D9D9;
  background: #fff; color: #333; transition: all 0.15s;
}
.modal-box .modal-btn:hover { border-color: #4096FF; color: #4096FF; }
.modal-box .modal-btn.danger {
  background: #FF4D4F; color: #fff; border-color: #FF4D4F;
}
.modal-box .modal-btn.danger:hover { background: #FF7875; border-color: #FF7875; }
</style>
</head>
<body>

<!-- 自定义确认弹窗 -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-icon">&#9888;</div>
    <div class="modal-msg" id="confirm-msg"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="confirm-cancel">取消</button>
      <button class="modal-btn danger" id="confirm-ok">确认删除</button>
    </div>
  </div>
</div>

<div id="app">
  <!-- Header -->
  <div id="header">
    <button id="btn-toggle-sidebar" title="展开/收起侧栏">◀</button>
    <div class="logo">🗺 MeterSphere 脑图</div>
    <select id="project-select">
      <option value="">加载中…</option>
    </select>
    <button class="hbtn" id="btn-refresh" title="刷新当前模块用例">
      ↻ 刷新
    </button>
    <button class="hbtn" id="btn-fullscreen" title="全屏展示脑图">
      ⛶ 全屏
    </button>
    <div class="spacer"></div>
    <span id="refresh-dot"></span>
    <span id="case-count" style="font-size:12px;color:#8C8C8C;"></span>
  </div>

  <!-- Content -->
  <div id="content">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-inner">
        <div id="sidebar-header">模块树</div>
        <div id="module-tree">
          <div class="empty-tip">请选择项目</div>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div id="main">
      <!-- 加载中 -->
      <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">加载中…</div>
      </div>

      <!-- 错误面板 -->
      <div id="error-panel">
        <div id="error-box">
          <div class="err-icon">⚠️</div>
          <div class="err-msg" id="error-msg">请求失败</div>
          <button id="btn-retry">重试</button>
        </div>
      </div>

      <!-- 空提示 -->
      <div id="canvas-placeholder">
        <div class="ph-icon">🌿</div>
        <div>请在左侧选择一个模块</div>
      </div>

      <!-- 可滚动画布 -->
      <div id="canvas-scroll" style="display:none;">
        <svg id="mindmap-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <!-- 缩放提示 -->
      <div id="zoom-hint">100%</div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
/* ════════════════════════════════════════════════════════
   常量
════════════════════════════════════════════════════════ */
const API_BASE = '';  // 同域代理，不需要前缀

// 布局常量（px）
const PADDING    = 40;   // 画布外边距
const ROW_HEIGHT = 56;   // 每步骤占用行高
const CASE_GAP   = 48;   // 用例间垂直间距
const NODE_H     = 36;   // 节点高度
const BADGE_H    = 20;   // badge 高度
const BADGE_PAD  = 8;    // badge 水平内边距
const PRI_R      = 10;   // 优先级徽章半径

// 新列宽常量（替换旧 COL_WIDTHS / COL_X）
const MODULE_W  = 130;
const CASE_W    = 220;
const PREREQ_W  = 200;
const STEP_W    = 240;
const RESULT_W  = 240;
const H_GAP     = 60;   // 列间距

const X_MODULE = PADDING;
const X_CASE   = X_MODULE + MODULE_W + H_GAP;
const X_PREREQ = X_CASE   + CASE_W   + H_GAP;
const X_STEP   = X_PREREQ + PREREQ_W + H_GAP;
const X_RESULT = X_STEP   + STEP_W   + H_GAP;

// 兼容旧代码使用的 COL_WIDTHS / COL_X（保留引用不报错）
const COL_WIDTHS = [CASE_W, PREREQ_W, STEP_W, RESULT_W];
const COL_GAPS   = [H_GAP, H_GAP, H_GAP];
const COL_X = [X_CASE, X_PREREQ, X_STEP, X_RESULT];

// badge 配置（颜色仿飞书风格）
const BADGE_STYLES = {
  case:    { bg: '#E6FFFB', color: '#006D75', border: '#87E8DE', label: '用例' },
  prereq:  { bg: '#FCFFE6', color: '#7CB305', border: '#D3F261', label: '前置条件' },
  step:    { bg: '#E6F4FF', color: '#0958D9', border: '#91CAFF', label: '步骤描述' },
  result:  { bg: '#F9F0FF', color: '#531DAB', border: '#D3ADF7', label: '预期结果' },
};

// 项目名 → projectId 映射（与后端 PROJECT_MAP 一致，用于创建用例）
const PROJECT_MAP_JS = {
  'global-web': '1465684991651422208',
  'global-app': '1465686383220826112',
  'CN-web':     '1470186838932258816',
  'CN-app':     '1470187027910819840',
};

// 优先级徽章颜色
const PRI_COLORS = {
  P0: '#FF4D4F', P1: '#FA8C16', P2: '#1890FF', P3: '#8C8C8C',
};

/* ════════════════════════════════════════════════════════
   状态
════════════════════════════════════════════════════════ */
let currentProject = '';
let currentModuleId = '';
let currentModuleName = '';   // 当前模块名，用于脑图根节点
let currentCases = [];
let scale = 1.0;
let autoRefreshTimer = null;
let lastRetryAction = null;  // 用于"重试"按钮
let cachedModuleTree = [];   // 缓存模块树数据（用于查找子模块）
let expandedModules = new Set();  // 模块地图中展开的模块 ID
let expandedCasesCache = {};     // 叶子模块展开后缓存的用例 { moduleId: [cases] }
let expandedCaseIds = new Set(); // 在模块地图中展开了步骤的用例 ID
let treeSelectedCase = null;     // 树视图中选中的用例 { caseObj, moduleId, index, element }

/* ════════════════════════════════════════════════════════
   DOM 引用
════════════════════════════════════════════════════════ */
const $sidebar        = document.getElementById('sidebar');
const $toggleBtn      = document.getElementById('btn-toggle-sidebar');
const $projectSelect  = document.getElementById('project-select');
const $moduleTree     = document.getElementById('module-tree');
const $loading        = document.getElementById('loading');
const $loadingText    = document.getElementById('loading-text');
const $errorPanel     = document.getElementById('error-panel');
const $errorMsg       = document.getElementById('error-msg');
const $btnRetry       = document.getElementById('btn-retry');
const $placeholder    = document.getElementById('canvas-placeholder');
const $canvasScroll   = document.getElementById('canvas-scroll');
const $svg            = document.getElementById('mindmap-svg');
const $btnRefresh     = document.getElementById('btn-refresh');
const $btnFullscreen  = document.getElementById('btn-fullscreen');
const $zoomHint       = document.getElementById('zoom-hint');

/** 自定义确认弹窗（替代 confirm()，避免 iframe 中显示丑陋的域名提示） */
function showConfirm(msg) {
  return new Promise((resolve) => {
    const $modal  = document.getElementById('confirm-modal');
    const $msg    = document.getElementById('confirm-msg');
    const $ok     = document.getElementById('confirm-ok');
    const $cancel = document.getElementById('confirm-cancel');
    $msg.textContent = msg;
    $modal.classList.add('show');
    function close(result) {
      $modal.classList.remove('show');
      $ok.removeEventListener('click', onOk);
      $cancel.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk() { close(true); }
    function onCancel() { close(false); }
    $ok.addEventListener('click', onOk);
    $cancel.addEventListener('click', onCancel);
  });
}
const $tooltip        = document.getElementById('tooltip');
const $caseCount      = document.getElementById('case-count');
const $refreshDot     = document.getElementById('refresh-dot');

/* ════════════════════════════════════════════════════════
   工具函数
════════════════════════════════════════════════════════ */

/** 截断文字（SVG 不原生支持 ellipsis，手动截断） */
function truncate(text, maxChars) {
  if (!text) return '';
  const s = String(text);
  return s.length > maxChars ? s.slice(0, maxChars - 1) + '…' : s;
}

/**
 * 按像素宽度截断文字（每汉字约 13px，ASCII 约 7px）
 * @param {string} text       - 原始文字
 * @param {number} maxPixels  - 可用像素宽度
 * @returns {string}          - 截断后文字（超出加 …）
 */
function truncateByPixel(text, maxPixels) {
  if (!text) return '';
  const s = String(text);
  let width = 0;
  for (let i = 0; i < s.length; i++) {
    const charW = s.charCodeAt(i) > 127 ? 13 : 7;
    if (width + charW > maxPixels) {
      return s.slice(0, i) + '…';
    }
    width += charW;
  }
  return s;
}

/** 解析 steps 字段（JSON 字符串 → 数组） */
function parseSteps(raw) {
  if (!raw) return [];
  try {
    const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    return Array.isArray(arr)
      ? arr.sort((a, b) => (a.num || 0) - (b.num || 0))
      : [];
  } catch { return []; }
}

/** 提取优先级（多种格式兼容） */
function getPriority(c) {
  // 1. detail 接口返回的 functionalPriority 字段（最准确）
  if (c.functionalPriority) return String(c.functionalPriority).toUpperCase();
  // 2. 直接 priority 字段
  if (c.priority) return String(c.priority).toUpperCase();
  // 3. customFields 中找 Case Priority / functional_priority
  const cf = (c.customFields || []).find(f =>
    f.internalFieldKey === 'functional_priority' ||
    (f.fieldName || '').toLowerCase().includes('priority') ||
    (f.fieldName || '').includes('等级')
  );
  if (cf) {
    const val = cf.value || cf.defaultValue;
    if (val) return String(val).toUpperCase();
  }
  // 4. 从名称解析 [P0] 或 P0:
  const m = (c.name || '').match(/\bP([0-3])\b/i);
  return m ? `P${m[1]}` : '';
}

/** 显示/隐藏 loading */
function showLoading(text = '加载中…') {
  $loadingText.textContent = text;
  $loading.classList.add('show');
  $errorPanel.classList.remove('show');
  $placeholder.style.display = 'none';
}
function hideLoading() { $loading.classList.remove('show'); }

/** 显示错误 */
function showError(msg, retryFn) {
  $errorMsg.textContent = msg;
  $errorPanel.classList.add('show');
  $loading.classList.remove('show');
  lastRetryAction = retryFn;
}
function hideError() { $errorPanel.classList.remove('show'); }

/** 带 JSON 错误提示的 fetch */
async function apiFetch(url, options = {}) {
  const resp = await fetch(API_BASE + url, options);
  if (!resp.ok) {
    const text = await resp.text().catch(() => '');
    throw new Error(`HTTP ${resp.status}: ${text.slice(0, 200)}`);
  }
  return resp.json();
}

/** 缩放提示（短暂显示后消失） */
let zoomHintTimer = null;
function showZoomHint(pct) {
  $zoomHint.textContent = `${Math.round(pct)}%`;
  $zoomHint.classList.add('show');
  clearTimeout(zoomHintTimer);
  zoomHintTimer = setTimeout(() => $zoomHint.classList.remove('show'), 1200);
}

/* ════════════════════════════════════════════════════════
   SVG 辅助函数
════════════════════════════════════════════════════════ */

/** 创建带命名空间的 SVG 元素 */
function svgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/**
 * 绘制节点：矩形背景 + 文字 + 右侧 badge
 * @param {SVGElement} parent  - 父元素（g 或 svg）
 * @param {number}     x, y   - 节点左上角坐标（y 为中线）
 * @param {number}     w      - 节点宽度
 * @param {string}     text   - 显示文字
 * @param {string}     type   - 'case' | 'prereq' | 'step' | 'result'
 * @param {string}     fullText - 完整文字（tooltip 用）
 * @param {string}     priority - 优先级（仅 case 用）
 * @returns {{ top, bottom, right, left, cy }} 节点锚点坐标
 */
function drawNode(parent, x, y, w, text, type, fullText, priority) {
  const cy = y;  // 垂直中心
  const top    = cy - NODE_H / 2;
  const bottom = cy + NODE_H / 2;

  const g = svgEl('g');

  if (type === 'case') {
    // 用例根节点：白色圆角矩形 + 蓝色边框
    const rect = svgEl('rect', {
      x, y: top, width: w, height: NODE_H,
      rx: 8, fill: '#fff',
      stroke: '#4096FF', 'stroke-width': 2,
    });
    g.appendChild(rect);

    // 优先级徽章（左侧，小圆形）
    let textX = x + 12;
    if (priority && PRI_COLORS[priority]) {
      const priColor = PRI_COLORS[priority];
      const cx_p = x + 10 + PRI_R;
      const cy_p = cy;
      const circle = svgEl('circle', { cx: cx_p, cy: cy_p, r: PRI_R, fill: priColor });
      const priTxt = svgEl('text', {
        x: cx_p, y: cy_p,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        'font-size': 10, 'font-weight': 700, fill: '#fff',
        'pointer-events': 'none',
      });
      priTxt.textContent = priority;
      g.appendChild(circle);
      g.appendChild(priTxt);
      textX = x + 10 + PRI_R * 2 + 8;
    }

    // 用例名文字（按像素截断）
    // 右侧留 8px 内边距 + 22px 折叠按钮空间
    const textMaxPx = w - (textX - x) - 8 - 22;
    const label = truncateByPixel(text, Math.max(textMaxPx, 40));
    const txt = svgEl('text', {
      x: textX, y: cy,
      'dominant-baseline': 'middle',
      'font-size': 13, 'font-weight': 500, fill: '#262626',
      'pointer-events': 'none',
    });
    txt.textContent = label;
    g.appendChild(txt);

  } else {
    // 其他节点（prereq/step/result）：badge 在左侧 + 文字在右侧
    const bs = BADGE_STYLES[type];
    const badgeLabel = bs.label;

    // 估算 badge 宽度
    const badgeW = badgeLabel.length * 13 + BADGE_PAD * 2;
    const badgeGap = 8;  // badge 与文字的间距

    // 可用文字像素宽度（badge + gap + 文字 + 右内边距 8）
    const textMaxPx = w - badgeW - badgeGap - 12;
    const label = truncateByPixel(text, Math.max(textMaxPx, 30));

    // hover 背景（pointer-events:all 确保透明区域也能接收点击/双击）
    const bg = svgEl('rect', {
      x, y: top, width: w, height: NODE_H,
      rx: 4, fill: 'transparent', 'data-hover': '1',
      'pointer-events': 'all',
    });
    bg.addEventListener('mouseenter', () => { bg.setAttribute('fill', 'rgba(64,150,255,0.06)'); });
    bg.addEventListener('mouseleave', () => { bg.setAttribute('fill', 'transparent'); });
    g.appendChild(bg);

    // badge（左侧）
    const bx = x + 4;
    const by = cy - BADGE_H / 2;
    const bRect = svgEl('rect', {
      x: bx, y: by, width: badgeW, height: BADGE_H,
      rx: BADGE_H / 2,
      fill: bs.bg, stroke: bs.border, 'stroke-width': 1,
    });
    const bTxt = svgEl('text', {
      x: bx + badgeW / 2, y: cy,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 11, fill: bs.color, 'font-weight': 500,
      'pointer-events': 'none',
    });
    bTxt.textContent = badgeLabel;
    g.appendChild(bRect);
    g.appendChild(bTxt);

    // 文字（badge 右侧）
    const textX = bx + badgeW + badgeGap;
    const txt = svgEl('text', {
      x: textX, y: cy,
      'dominant-baseline': 'middle',
      'font-size': 13, fill: '#262626',
      'pointer-events': 'none',
    });
    txt.textContent = label;
    g.appendChild(txt);
  }

  // Tooltip（鼠标悬浮时显示完整文字）
  if (fullText) {
    g.addEventListener('mouseenter', (e) => showTooltip(e, fullText));
    g.addEventListener('mousemove',  (e) => moveTooltip(e));
    g.addEventListener('mouseleave', hideTooltip);
  }

  parent.appendChild(g);
  return { top, bottom, left: x, right: x + w, cy };
}

/**
 * 绘制 Bezier 连接线（从源右边中心 → 目标左边中心）
 */
function drawConnector(parent, sx, sy, tx, ty) {
  const mx = (sx + tx) / 2;
  const d  = `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
  const path = svgEl('path', {
    d, stroke: '#4096FF', 'stroke-width': 1.5,
    fill: 'none', opacity: 0.5,
  });
  parent.appendChild(path);
}

/* ════════════════════════════════════════════════════════
   脑图渲染
════════════════════════════════════════════════════════ */

/**
 * 计算每个用例在 SVG 中占用的行数（步骤数 vs 1）
 * 同时返回 steps 数组和 prereq 文字
 */
function calcCaseRows(c) {
  const steps = parseSteps(c.steps);
  if (steps.length === 0) return 1;
  let total = 0;
  steps.forEach(s => {
    const rt = s.result || s.expected || '';
    const lines = rt ? rt.split('\n').filter(l => l.trim()) : [];
    total += Math.max(1, lines.length);
  });
  return Math.max(total, 1);
}

/**
 * 绘制模块根节点（最左侧，垂直居中于所有用例）
 * @param {SVGElement} parent   - 父节点层
 * @param {string}     name     - 模块名
 * @param {number}     cy       - 垂直中心 Y
 * @returns {{ right, cy }}     - 右侧锚点
 */
function drawModuleNode(parent, name, cy) {
  const x   = X_MODULE;
  const top = cy - 20;
  const g   = svgEl('g');

  const rect = svgEl('rect', {
    x, y: top, width: MODULE_W, height: 40,
    rx: 8, fill: '#F0F5FF',
    stroke: '#4096FF', 'stroke-width': 2,
  });
  g.appendChild(rect);

  // 截断模块名（模块宽 130px，左右各留 8px 内边距）
  const label = truncateByPixel(name || '模块', MODULE_W - 16);
  const txt = svgEl('text', {
    x: x + MODULE_W / 2, y: cy,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    'font-size': 14, 'font-weight': 700, fill: '#1677FF',
    'pointer-events': 'none',
  });
  txt.textContent = label;
  g.appendChild(txt);

  if (name) {
    g.addEventListener('mouseenter', (e) => showTooltip(e, name));
    g.addEventListener('mousemove',  (e) => moveTooltip(e));
    g.addEventListener('mouseleave', hideTooltip);
  }

  parent.appendChild(g);
  return { right: x + MODULE_W, cy };
}

/** 在缓存的模块树中按 ID 查找节点 */
function findModuleById(nodes, id) {
  if (!nodes) return null;
  for (const n of nodes) {
    if (n.id === id) return n;
    const found = findModuleById(n.children, id);
    if (found) return found;
  }
  return null;
}

/**
 * 渲染模块结构脑图（支持多级目录逐级展开/收起）
 * - 目录模块：点击展开/收起子模块
 * - 叶子模块：点击展开/收起该模块下的用例列表
 */
let _moduleMapParent = null;
let _moduleMapChildren = null;

function renderModuleMap(parentModule, childModules, resetScale = true) {
  _moduleMapParent = parentModule;
  _moduleMapChildren = childModules;

  clearSelection();
  while ($svg.firstChild) $svg.removeChild($svg.firstChild);
  document.querySelectorAll('.inline-editor').forEach(el => el.remove());

  if (!childModules || childModules.length === 0) return;

  $canvasScroll.style.display = '';
  $placeholder.style.display = 'none';

  const MM_ROW = 44;      // 模块行高
  const MM_CASE_ROW = 36; // 用例行高
  const MM_STEP_ROW = 30; // 步骤行高
  const MM_GAP = 6;       // 行间距
  const MM_W = 200;       // 节点宽度
  const MM_CASE_W = 260;  // 用例节点宽度
  const MM_STEP_W = 220;  // 步骤节点宽度
  const MM_RESULT_W = 220; // 预期结果节点宽度
  const MM_H_GAP = 50;    // 水平间距

  /** 计算单个用例的高度（含展开的步骤，跳过空步骤） */
  function calcCaseH(c) {
    if (!expandedCaseIds.has(c.id)) return MM_CASE_ROW;
    const steps = parseSteps(c.steps);
    const visibleSteps = steps.filter(s => (s.desc || s.description || '').trim() || (s.result || s.expected || '').trim());
    if (visibleSteps.length === 0) return MM_CASE_ROW;
    const stepsH = visibleSteps.length * MM_STEP_ROW + (visibleSteps.length - 1) * MM_GAP;
    return Math.max(MM_CASE_ROW, stepsH);
  }

  // ── 递归计算子树高度 ──
  function calcHeight(node) {
    const isExpanded = expandedModules.has(node.id);
    const hasChildren = node.children && node.children.length > 0;

    if (!isExpanded) return MM_ROW;

    if (hasChildren) {
      let h = 0;
      node.children.forEach((c, i) => {
        if (i > 0) h += MM_GAP;
        h += calcHeight(c);
      });
      return Math.max(MM_ROW, h);
    }

    // 叶子模块展开 → 显示用例
    const cases = expandedCasesCache[node.id];
    if (cases && cases.length > 0) {
      let h = 0;
      cases.forEach((c, i) => {
        if (i > 0) h += MM_GAP;
        h += calcCaseH(c);
      });
      return Math.max(MM_ROW, h);
    }
    return MM_ROW;
  }

  // ── 计算最大深度（用于画布宽度）──
  function calcMaxDepth(nodes, depth) {
    let max = depth;
    nodes.forEach(n => {
      if (expandedModules.has(n.id)) {
        if (n.children && n.children.length > 0) {
          max = Math.max(max, calcMaxDepth(n.children, depth + 1));
        } else if (expandedCasesCache[n.id]) {
          // 用例层 + 可能的步骤层 + 预期结果层
          const hasCaseExpanded = expandedCasesCache[n.id].some(c => expandedCaseIds.has(c.id));
          max = Math.max(max, depth + 1 + (hasCaseExpanded ? 2 : 0));
        }
      }
    });
    return max;
  }

  // 整体高度
  let totalH = 0;
  childModules.forEach((c, i) => {
    if (i > 0) totalH += MM_GAP;
    totalH += calcHeight(c);
  });

  const maxDepth = calcMaxDepth(childModules, 1);
  const svgW = X_MODULE + MODULE_W + MM_H_GAP + (maxDepth) * (MM_W + MM_H_GAP) + MM_CASE_W + PADDING * 2;
  const svgH = PADDING * 2 + totalH;

  $svg.setAttribute('width', svgW);
  $svg.setAttribute('height', svgH);
  $svg.style.width  = svgW + 'px';
  $svg.style.height = svgH + 'px';

  const lineLayer = svgEl('g', { id: 'lines' });
  $svg.appendChild(lineLayer);
  const nodeLayer = svgEl('g', { id: 'nodes' });
  $svg.appendChild(nodeLayer);

  // 根节点
  const rootCY = PADDING + totalH / 2;
  const rootAnchors = drawModuleNode(nodeLayer, parentModule.name || currentModuleName, rootCY);

  $caseCount.textContent = '';

  // ── 递归渲染子树 ──
  function renderSubtree(nodes, x, yStart, parentRight, parentCY) {
    let curY = yStart;
    nodes.forEach((node, ni) => {
      const subtreeH = calcHeight(node);
      const cy = curY + subtreeH / 2;
      const isExpanded = expandedModules.has(node.id);
      const hasChildren = node.children && node.children.length > 0;
      const isLeaf = !hasChildren;
      const hasCases = isLeaf && expandedCasesCache[node.id] && expandedCasesCache[node.id].length > 0;

      // ── 绘制模块节点 ──
      const g = svgEl('g', { style: 'cursor:pointer' });

      const fillColor = isLeaf
        ? (isExpanded && hasCases ? '#F6FFED' : '#fff')
        : (isExpanded ? '#E6F4FF' : '#F0F5FF');
      const strokeColor = isLeaf
        ? (isExpanded && hasCases ? '#52C41A' : '#D9D9D9')
        : '#4096FF';

      const rect = svgEl('rect', {
        x, y: cy - MM_ROW / 2 + 2, width: MM_W, height: MM_ROW - 4,
        rx: 6, fill: fillColor, stroke: strokeColor, 'stroke-width': 1.5,
        'pointer-events': 'all',
      });
      g.appendChild(rect);

      // 展开/收起图标
      const canExpand = hasChildren || isLeaf;
      if (canExpand) {
        const icon = svgEl('text', {
          x: x + 14, y: cy,
          'dominant-baseline': 'middle', 'text-anchor': 'middle',
          'font-size': 10, fill: isLeaf ? '#52C41A' : '#4096FF', 'pointer-events': 'none',
        });
        icon.textContent = isExpanded ? '▼' : '▶';
        g.appendChild(icon);
      }

      // 模块名
      const label = truncateByPixel(node.name || '', MM_W - 44);
      const txt = svgEl('text', {
        x: x + 26, y: cy,
        'dominant-baseline': 'middle',
        'font-size': 13, fill: isLeaf ? '#333' : '#1677FF',
        'font-weight': hasChildren ? 600 : 400,
        'pointer-events': 'none',
      });
      txt.textContent = label;
      g.appendChild(txt);

      // hover
      g.addEventListener('mouseenter', () => rect.setAttribute('fill', isLeaf ? '#FAFAFA' : '#E6F4FF'));
      g.addEventListener('mouseleave', () => rect.setAttribute('fill', fillColor));
      g.addEventListener('mouseenter', (e) => showTooltip(e, node.name));
      g.addEventListener('mousemove',  (e) => moveTooltip(e));
      g.addEventListener('mouseleave', hideTooltip);

      // 点击事件
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isExpanded) {
          expandedModules.delete(node.id);
          renderModuleMap(parentModule, childModules, false);
        } else {
          expandedModules.add(node.id);
          if (isLeaf && !expandedCasesCache[node.id]) {
            // 异步加载用例
            loadModuleCasesInline(node.id);
          } else {
            renderModuleMap(parentModule, childModules, false);
          }
        }
      });

      nodeLayer.appendChild(g);

      // 连接线到父级（直角折线）
      const midLX = parentRight + (x - parentRight) * 0.5;
      lineLayer.appendChild(svgEl('path', {
        d: `M ${parentRight} ${parentCY} L ${midLX} ${parentCY} L ${midLX} ${cy} L ${x} ${cy}`,
        stroke: '#4096FF', 'stroke-width': 1.2, fill: 'none', opacity: 0.5,
      }));

      // ── 递归渲染子节点 ──
      if (isExpanded) {
        const childX = x + MM_W + MM_H_GAP;
        const nodeRight = x + MM_W;

        if (hasChildren) {
          renderSubtree(node.children, childX, curY, nodeRight, cy);
        } else if (hasCases) {
          // 渲染用例列表（支持展开步骤、拖拽排序、tooltip、编辑）
          const cases = expandedCasesCache[node.id];
          let caseY = curY;

          // 直角折线连接器（模块树专用）
          function treeLine(layer, sx, sy, tx, ty) {
            const midX = sx + (tx - sx) * 0.5;
            const d = `M ${sx} ${sy} L ${midX} ${sy} L ${midX} ${ty} L ${tx} ${ty}`;
            layer.appendChild(svgEl('path', {
              d, stroke: '#B7EB8F', 'stroke-width': 1.2, fill: 'none', opacity: 0.7,
            }));
          }

          cases.forEach((c, ci) => {
            const caseH = calcCaseH(c);
            const caseCY = caseY + caseH / 2;
            const pri = getPriority(c);
            const isCaseExpanded = expandedCaseIds.has(c.id);
            const steps = parseSteps(c.steps);
            const hasSteps = steps.length > 0;

            const caseG = svgEl('g', { style: 'cursor:default', 'data-tree-case-id': c.id });

            // 用例背景
            const caseFill = isCaseExpanded ? '#F6FFED' : '#fff';
            const caseStroke = isCaseExpanded ? '#B7EB8F' : '#E8E8E8';
            const caseRect = svgEl('rect', {
              x: childX, y: caseCY - MM_CASE_ROW / 2 + 2, width: MM_CASE_W, height: MM_CASE_ROW - 4,
              rx: 4, fill: caseFill, stroke: caseStroke, 'stroke-width': 1,
              'pointer-events': 'all',
            });
            caseG.appendChild(caseRect);

            // 拖拽手柄 ⋮⋮
            if (!isReadonly) {
              const dhG = svgEl('g', { style: 'cursor:grab; opacity:0; transition: opacity 0.15s;' });
              const dhX = childX - 16;
              // 手柄背景
              dhG.appendChild(svgEl('rect', {
                x: dhX - 10, y: caseCY - 14, width: 20, height: 28,
                rx: 4, fill: '#F0F0F0', stroke: '#D9D9D9', 'stroke-width': 0.5, 'pointer-events': 'all',
              }));
              // 六点拖拽图标
              [-6, 0, 6].forEach(dy => {
                [-3, 3].forEach(dx => {
                  dhG.appendChild(svgEl('circle', {
                    cx: dhX + dx, cy: caseCY + dy, r: 1.5,
                    fill: '#8C8C8C', 'pointer-events': 'none',
                  }));
                });
              });
              caseG.appendChild(dhG);
              caseG.addEventListener('mouseenter', () => { dhG.style.opacity = '1'; });
              caseG.addEventListener('mouseleave', () => { if (!treeDragState) dhG.style.opacity = '0'; });
              dhG.addEventListener('mousedown', (e) => {
                e.preventDefault(); e.stopPropagation();
                startTreeCaseDrag(node.id, ci, cases, childX, caseCY, e);
              });
            }

            // 优先级小圆点
            if (pri && PRI_COLORS[pri]) {
              caseG.appendChild(svgEl('circle', {
                cx: childX + 12, cy: caseCY, r: 4,
                fill: PRI_COLORS[pri], 'pointer-events': 'none',
              }));
            }

            // 用例名
            const nameMaxW = MM_CASE_W - (hasSteps ? 50 : 30);
            const caseLabel = truncateByPixel(c.name || '', nameMaxW);
            const caseTxt = Object.assign(svgEl('text', {
              x: childX + (pri ? 22 : 10), y: caseCY,
              'dominant-baseline': 'middle',
              'font-size': 12, fill: '#333', 'pointer-events': 'none',
            }), { textContent: caseLabel });
            caseG.appendChild(caseTxt);

            // 双击编辑用例名
            if (!isReadonly) {
              caseG.style.cursor = 'pointer';
              caseG.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const nodeRect = caseG.getBoundingClientRect();
                const scrollRect = $canvasScroll.getBoundingClientRect();
                const edLeft = nodeRect.left - scrollRect.left + $canvasScroll.scrollLeft;
                const edTop  = nodeRect.top  - scrollRect.top  + $canvasScroll.scrollTop;
                document.querySelectorAll('.inline-editor').forEach(el => el.remove());
                const editor = document.createElement('div');
                editor.className = 'inline-editor';
                editor.contentEditable = 'true';
                editor.textContent = c.name || '';
                editor.style.cssText = `position:absolute;left:${edLeft}px;top:${edTop}px;width:${nodeRect.width}px;min-height:${nodeRect.height}px;background:#fff;border:2px solid #4096FF;border-radius:4px;padding:4px 8px;font-size:12px;outline:none;z-index:200;white-space:pre-wrap;`;
                $canvasScroll.appendChild(editor);
                editor.focus();
                // 选中全部文字
                const range = document.createRange();
                range.selectNodeContents(editor);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                async function save() {
                  const newName = editor.textContent.trim();
                  editor.remove();
                  if (newName && newName !== c.name) {
                    try {
                      await apiFetch(`/api/cases/${c.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName }),
                      });
                      c.name = newName;
                      renderModuleMap(parentModule, childModules, false);
                    } catch (err) { alert('保存失败：' + err.message); }
                  }
                }
                editor.addEventListener('blur', save, { once: true });
                editor.addEventListener('keydown', (ke) => {
                  if (ke.key === 'Enter' && !ke.shiftKey) { ke.preventDefault(); editor.blur(); }
                  if (ke.key === 'Escape') { editor.textContent = c.name || ''; editor.blur(); }
                });
              });
            }

            // 展开/收起按钮（+/-）
            if (hasSteps) {
              const btnX = childX + MM_CASE_W - 18;
              const btnG = svgEl('g', { style: 'cursor:pointer' });
              btnG.appendChild(svgEl('circle', {
                cx: btnX, cy: caseCY, r: 8,
                fill: isCaseExpanded ? '#52C41A' : '#D9D9D9', 'pointer-events': 'all',
              }));
              btnG.appendChild(Object.assign(svgEl('text', {
                x: btnX, y: caseCY,
                'text-anchor': 'middle', 'dominant-baseline': 'middle',
                'font-size': 12, fill: '#fff', 'font-weight': 700, 'pointer-events': 'none',
              }), { textContent: isCaseExpanded ? '−' : '+' }));
              btnG.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isCaseExpanded) expandedCaseIds.delete(c.id);
                else expandedCaseIds.add(c.id);
                renderModuleMap(parentModule, childModules, false);
              });
              caseG.appendChild(btnG);
            }

            // hover & tooltip（显示完整用例名）
            caseG.addEventListener('mouseenter', () => caseRect.setAttribute('fill', isCaseExpanded ? '#EAFFEA' : '#FAFAFA'));
            caseG.addEventListener('mouseleave', () => caseRect.setAttribute('fill', caseFill));
            caseG.addEventListener('mouseenter', (e) => showTooltip(e, c.name));
            caseG.addEventListener('mousemove',  (e) => moveTooltip(e));
            caseG.addEventListener('mouseleave', hideTooltip);
            // 点击选中用例（支持 Enter 新增 / Delete 删除）
            caseG.addEventListener('click', (e) => {
              e.stopPropagation();
              treeSelectNode({ caseObj: c, moduleId: node.id, index: ci, field: 'case', element: caseG }, '#4096FF');
            });

            nodeLayer.appendChild(caseG);
            treeLine(lineLayer, nodeRight, cy, childX, caseCY);

            // ── 展开的步骤 + 预期结果 ──
            if (isCaseExpanded && hasSteps) {
              const stepX = childX + MM_CASE_W + MM_H_GAP;
              const resultX = stepX + MM_STEP_W + MM_H_GAP;
              const caseRight = childX + MM_CASE_W;
              let stepY = caseY;

              // 树视图内联编辑辅助
              function treeInlineEdit(svgNode, origText, borderColor, onSave) {
                if (isReadonly) return;
                const nr = svgNode.getBoundingClientRect();
                const sr = $canvasScroll.getBoundingClientRect();
                const el = document.createElement('div');
                el.className = 'inline-editor';
                el.contentEditable = 'true';
                el.textContent = origText;
                el.style.cssText = `position:absolute;left:${nr.left - sr.left + $canvasScroll.scrollLeft}px;top:${nr.top - sr.top + $canvasScroll.scrollTop}px;width:${nr.width}px;min-height:${nr.height}px;background:#fff;border:2px solid ${borderColor};border-radius:4px;padding:3px 8px;font-size:11px;outline:none;z-index:200;white-space:pre-wrap;`;
                document.querySelectorAll('.inline-editor').forEach(e => e.remove());
                $canvasScroll.appendChild(el);
                el.focus();
                const rng = document.createRange(); rng.selectNodeContents(el);
                window.getSelection().removeAllRanges(); window.getSelection().addRange(rng);
                function save() {
                  const val = el.textContent.trim(); el.remove();
                  if (val !== origText) onSave(val);
                }
                el.addEventListener('blur', save, { once: true });
                el.addEventListener('keydown', (ke) => {
                  if (ke.key === 'Enter' && !ke.shiftKey) { ke.preventDefault(); el.blur(); }
                  if (ke.key === 'Escape') { el.textContent = origText; el.blur(); }
                });
              }

              steps.forEach((step, si) => {
                const stepText = step.desc || step.description || '';
                const resultText = (step.result || step.expected || '').split('\n')[0].trim();

                // 跳过步骤和结果都为空的行
                if (!stepText && !resultText) { return; }

                const stepCY = stepY + MM_STEP_ROW / 2;

                // 步骤节点（双击可编辑）
                const sG = svgEl('g', { style: 'cursor:pointer' });
                sG.appendChild(svgEl('rect', {
                  x: stepX, y: stepCY - MM_STEP_ROW / 2 + 2, width: MM_STEP_W, height: MM_STEP_ROW - 4,
                  rx: 4, fill: '#E6F4FF', stroke: '#91CAFF', 'stroke-width': 1, 'pointer-events': 'all',
                }));
                sG.appendChild(Object.assign(svgEl('text', {
                  x: stepX + 8, y: stepCY, 'dominant-baseline': 'middle',
                  'font-size': 11, fill: '#0958D9', 'pointer-events': 'none',
                }), { textContent: truncateByPixel(stepText, MM_STEP_W - 16) }));
                sG.addEventListener('mouseenter', (e) => showTooltip(e, stepText));
                sG.addEventListener('mousemove',  (e) => moveTooltip(e));
                sG.addEventListener('mouseleave', hideTooltip);
                // 点击选中步骤
                sG.addEventListener('click', (e) => {
                  e.stopPropagation();
                  treeSelectNode({ caseObj: c, moduleId: node.id, index: ci, field: 'step', stepIdx: si, element: sG }, '#91CAFF');
                });
                sG.addEventListener('dblclick', (e) => {
                  e.stopPropagation();
                  treeInlineEdit(sG, stepText, '#91CAFF', async (val) => {
                    const arr = parseSteps(c.steps);
                    if (arr[si]) { arr[si].desc = val; arr[si].description = val; }
                    await patchCaseSteps(c, arr);
                    renderModuleMap(parentModule, childModules, false);
                  });
                });
                nodeLayer.appendChild(sG);
                treeLine(lineLayer, caseRight, caseCY, stepX, stepCY);

                // 预期结果节点（双击可编辑）
                if (resultText) {
                  const rG = svgEl('g', { style: 'cursor:pointer' });
                  rG.appendChild(svgEl('rect', {
                    x: resultX, y: stepCY - MM_STEP_ROW / 2 + 2, width: MM_RESULT_W, height: MM_STEP_ROW - 4,
                    rx: 4, fill: '#F9F0FF', stroke: '#D3ADF7', 'stroke-width': 1, 'pointer-events': 'all',
                  }));
                  rG.appendChild(Object.assign(svgEl('text', {
                    x: resultX + 8, y: stepCY, 'dominant-baseline': 'middle',
                    'font-size': 11, fill: '#531DAB', 'pointer-events': 'none',
                  }), { textContent: truncateByPixel(resultText, MM_RESULT_W - 16) }));
                  rG.addEventListener('mouseenter', (e) => showTooltip(e, resultText));
                  rG.addEventListener('mousemove',  (e) => moveTooltip(e));
                  rG.addEventListener('mouseleave', hideTooltip);
                  // 点击选中预期结果
                  rG.addEventListener('click', (e) => {
                    e.stopPropagation();
                    treeSelectNode({ caseObj: c, moduleId: node.id, index: ci, field: 'result', stepIdx: si, element: rG }, '#D3ADF7');
                  });
                  rG.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    treeInlineEdit(rG, resultText, '#D3ADF7', async (val) => {
                      const arr = parseSteps(c.steps);
                      if (arr[si]) { arr[si].result = val; arr[si].expected = val; }
                      await patchCaseSteps(c, arr);
                      renderModuleMap(parentModule, childModules, false);
                    });
                  });
                  nodeLayer.appendChild(rG);
                  treeLine(lineLayer, stepX + MM_STEP_W, stepCY, resultX, stepCY);
                }

                stepY += MM_STEP_ROW + MM_GAP;
              });
            }

            caseY += caseH + MM_GAP;
          });
        }
      }

      curY += subtreeH + MM_GAP;
    });
  }

  renderSubtree(childModules, X_MODULE + MODULE_W + MM_H_GAP, PADDING, rootAnchors.right, rootAnchors.cy);

  if (resetScale) applyScale(1.0, false);
  else applyScale(scale, false);
}

/** 树视图中选中节点（统一处理选中/取消选中） */
function treeSelectNode(nodeInfo, strokeColor) {
  // 清除旧选中
  if (treeSelectedCase && treeSelectedCase.element) {
    const oldRect = treeSelectedCase.element.querySelector('rect');
    if (oldRect) {
      oldRect.setAttribute('stroke', oldRect.dataset.origStroke || '#E8E8E8');
      oldRect.setAttribute('stroke-width', '1');
    }
  }
  // 设置新选中
  treeSelectedCase = nodeInfo;
  const rect = nodeInfo.element.querySelector('rect');
  if (rect) {
    rect.dataset.origStroke = rect.getAttribute('stroke');
    rect.setAttribute('stroke', strokeColor || '#4096FF');
    rect.setAttribute('stroke-width', '2.5');
  }
}

/** 模块树视图中的用例拖拽排序 */
let treeDragState = null;
let treeDragGroup = null;  // SVG group for all drag visual elements

function startTreeCaseDrag(moduleId, caseIdx, cases, caseX, startCY, e) {
  const MM_CASE_W = 260;

  // 收集每个用例的屏幕 Y 位置（直接用 clientY 对比，避免坐标转换误差）
  const positions = [];
  cases.forEach((c, i) => {
    const el = $svg.querySelector(`[data-tree-case-id="${c.id}"]`);
    if (el) {
      const rect = el.getBoundingClientRect();
      positions.push({ index: i, clientCY: rect.top + rect.height / 2, clientTop: rect.top, clientBottom: rect.bottom, id: c.id });
    }
  });

  treeDragState = { moduleId, caseIdx, cases, positions, insertIdx: -1 };

  // 创建拖拽视觉效果组
  treeDragGroup = svgEl('g', { id: 'tree-drag-overlay' });

  // 被拖拽元素的半透明副本
  const dragGhost = svgEl('rect', {
    x: caseX, y: startCY - 16, width: MM_CASE_W, height: 32,
    rx: 4, fill: '#4096FF', opacity: 0.15, 'pointer-events': 'none',
  });
  treeDragGroup.appendChild(dragGhost);

  // 插入位置指示器（粗线 + 箭头）
  const dropLine = svgEl('g', { display: 'none' });
  dropLine.appendChild(svgEl('line', {
    x1: caseX - 10, x2: caseX + MM_CASE_W + 10,
    y1: 0, y2: 0,
    stroke: '#4096FF', 'stroke-width': 3, 'stroke-linecap': 'round',
  }));
  // 左侧小箭头
  dropLine.appendChild(svgEl('polygon', {
    points: '0,0', fill: '#4096FF',  // 会在 onMove 里更新
  }));
  // 插入提示圆点
  dropLine.appendChild(svgEl('circle', {
    cx: caseX - 10, cy: 0, r: 4, fill: '#4096FF',
  }));
  treeDragGroup.appendChild(dropLine);

  $svg.appendChild(treeDragGroup);

  // 高亮源元素
  const srcEl = $svg.querySelector(`[data-tree-case-id="${cases[caseIdx].id}"]`);
  if (srcEl) {
    const srcRect = srcEl.querySelector('rect');
    if (srcRect) { srcRect.setAttribute('stroke', '#4096FF'); srcRect.setAttribute('stroke-width', '2'); }
  }

  document.body.style.cursor = 'grabbing';

  // 屏幕坐标 → SVG 坐标
  function clientToSvgY(clientY) {
    const svgRect = $svg.getBoundingClientRect();
    return (clientY - svgRect.top + $canvasScroll.scrollTop) / scale;
  }

  function onMove(ev) {
    if (!treeDragState) return;
    const mouseClientY = ev.clientY;
    const mouseSvgY = clientToSvgY(mouseClientY);

    // 移动幽灵
    dragGhost.setAttribute('y', mouseSvgY - 16);

    // 用 clientY 直接对比用例的屏幕位置（最准确）
    let insertIdx = positions.length;
    let lineClientY = 0;
    for (let i = 0; i < positions.length; i++) {
      if (mouseClientY < positions[i].clientCY) {
        insertIdx = i;
        lineClientY = positions[i].clientTop - 3;
        break;
      }
    }
    if (insertIdx >= positions.length && positions.length > 0) {
      lineClientY = positions[positions.length - 1].clientBottom + 3;
    }
    treeDragState.insertIdx = insertIdx;

    // 转成 SVG Y 画线
    const lineY = clientToSvgY(lineClientY);

    // 跟自己位置一样时不显示指示线
    if (insertIdx === caseIdx || insertIdx === caseIdx + 1) {
      dropLine.setAttribute('display', 'none');
    } else {
      dropLine.setAttribute('display', '');
      // 更新线的 Y 位置
      const line = dropLine.querySelector('line');
      line.setAttribute('y1', lineY);
      line.setAttribute('y2', lineY);
      // 更新箭头
      const arrow = dropLine.querySelector('polygon');
      arrow.setAttribute('points', `${caseX - 16},${lineY - 5} ${caseX - 10},${lineY} ${caseX - 16},${lineY + 5}`);
      // 更新圆点
      const dot = dropLine.querySelector('circle');
      dot.setAttribute('cy', lineY);
    }
  }

  async function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';

    // 恢复源元素样式
    if (srcEl) {
      const srcRect = srcEl.querySelector('rect');
      if (srcRect) { srcRect.setAttribute('stroke', '#E8E8E8'); srcRect.setAttribute('stroke-width', '1'); }
    }

    // 清理视觉元素
    if (treeDragGroup) { treeDragGroup.remove(); treeDragGroup = null; }
    if (!treeDragState) return;

    const { caseIdx: fromIdx, cases: caseList, moduleId: modId, insertIdx } = treeDragState;
    treeDragState = null;

    // 无变化
    if (insertIdx < 0 || insertIdx === fromIdx || insertIdx === fromIdx + 1) return;

    const projectId = PROJECT_MAP_JS[currentProject];
    if (!projectId || caseList.length < 2) return;

    const moveCase = caseList[fromIdx];
    if (!moveCase) return;

    let targetId, moveMode;
    if (insertIdx === 0) {
      targetId = caseList[0].id;
      moveMode = 'BEFORE';
    } else if (insertIdx >= caseList.length) {
      targetId = caseList[caseList.length - 1].id;
      moveMode = 'AFTER';
    } else {
      targetId = caseList[insertIdx].id;
      moveMode = 'BEFORE';
    }

    if (!targetId || targetId === moveCase.id) return;

    try {
      await apiFetch('/api/cases/drag-sort', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId, moveId: moveCase.id, targetId, moveMode }),
      });
      delete expandedCasesCache[modId];
      await loadModuleCasesInline(modId);
    } catch (err) {
      alert('排序失败：' + err.message);
    }
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/** 异步加载叶子模块的用例列表（用于模块地图内联展开） */
async function loadModuleCasesInline(moduleId) {
  try {
    showLoading('加载用例…');
    const cases = await apiFetch(
      `/api/cases?project=${encodeURIComponent(currentProject)}&moduleId=${encodeURIComponent(moduleId)}`
    );
    hideLoading();
    expandedCasesCache[moduleId] = cases || [];
    if (_moduleMapParent && _moduleMapChildren) {
      renderModuleMap(_moduleMapParent, _moduleMapChildren, false);
    }
  } catch (e) {
    hideLoading();
    alert('加载用例失败：' + e.message);
  }
}

/**
 * 渲染整个脑图
 * @param {Array}  cases      - 用例数组
 * @param {string} moduleName - 模块名（用于根节点）
 */
function renderMindmap(cases, moduleName, resetScale = true) {
  // 清空 SVG、旧编辑框和选中状态
  clearSelection();
  while ($svg.firstChild) $svg.removeChild($svg.firstChild);
  document.querySelectorAll('.inline-editor').forEach(el => el.remove());

  if (!cases || cases.length === 0) {
    $canvasScroll.style.display = 'none';
    $placeholder.style.display = '';
    $placeholder.querySelector('div:last-child').textContent = '该模块暂无用例';
    $caseCount.textContent = '';
    return;
  }

  $canvasScroll.style.display = '';
  $placeholder.style.display = 'none';
  $caseCount.textContent = `共 ${cases.length} 条`;

  // 计算总高度
  let totalRows = 0;
  cases.forEach(c => { totalRows += calcCaseRows(c); });

  const svgW = X_RESULT + RESULT_W + PADDING;
  const svgH = PADDING * 2 + totalRows * ROW_HEIGHT + (cases.length - 1) * CASE_GAP + ROW_HEIGHT;

  $svg.setAttribute('width', svgW);
  $svg.setAttribute('height', svgH);
  $svg.style.width  = svgW + 'px';
  $svg.style.height = svgH + 'px';

  // 连接线层（先绘制，在节点下面）
  const lineLayer = svgEl('g', { id: 'lines' });
  $svg.appendChild(lineLayer);

  // 节点层
  const nodeLayer = svgEl('g', { id: 'nodes' });
  $svg.appendChild(nodeLayer);

  // 模块根节点（垂直居中于所有用例）
  const totalH = totalRows * ROW_HEIGHT + (cases.length - 1) * CASE_GAP;
  const moduleRootCY = PADDING + NODE_H / 2 + (totalH - ROW_HEIGHT) / 2;
  const moduleAnchors = drawModuleNode(nodeLayer, moduleName || '模块', moduleRootCY);

  let curY = PADDING + NODE_H / 2;  // 当前垂直中心

  cases.forEach((c, ci) => {
    const steps  = parseSteps(c.steps);
    const prereq = c.prerequisite || '';
    const rows   = calcCaseRows(c);
    const pri    = getPriority(c);

    // 用例节点垂直居中于所有步骤行
    const blockH = rows * ROW_HEIGHT;
    const caseCY = curY + (blockH - ROW_HEIGHT) / 2;

    // ── 用例节点（X_CASE 列）──
    const caseG = svgEl('g', { 'data-case-id': c.id || '' });

    // 先把 caseG 加入 nodeLayer，再调用 drawNode 内部绘制
    // 这里我们直接手动绘制到 caseG 而不用 drawNode（保持灵活）
    const caseCoreAnchors = drawNode(
      caseG, X_CASE, caseCY, CASE_W,
      c.name || '未命名用例', 'case', c.name, pri
    );
    // 用例节点可选中：+ → 新增步骤，双击 → 编辑用例名称
    bindEditDblClick(caseG, c, 'caseName', -1, c.name || '', caseCoreAnchors);
    bindSelectable(caseG, c, 'case', -1, caseCoreAnchors);

    // ── Drag handle (⋮⋮) ──
    const dragHandleG = svgEl('g', { class: 'drag-handle', style: 'cursor: grab; opacity: 0;' });
    const dhX = X_CASE - 20;
    const dhText = svgEl('text', {
      x: dhX, y: caseCY,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 14, fill: '#BFBFBF', 'pointer-events': 'none',
    });
    dhText.textContent = '⋮⋮';
    dragHandleG.appendChild(svgEl('rect', {
      x: dhX - 10, y: caseCY - 14, width: 20, height: 28,
      fill: 'transparent', 'pointer-events': 'all',
    }));
    dragHandleG.appendChild(dhText);
    caseG.appendChild(dragHandleG);

    // Show/hide drag handle on case hover
    caseG.addEventListener('mouseenter', () => { if (!isReadonly) dragHandleG.style.opacity = '1'; });
    caseG.addEventListener('mouseleave', () => { dragHandleG.style.opacity = '0'; });

    // Drag start
    dragHandleG.addEventListener('mousedown', (e) => {
      if (isReadonly) return;
      e.preventDefault();
      e.stopPropagation();
      startCaseDrag(ci, caseCY, e);
    });

    // 折叠按钮（右侧 +/- 圆形）
    const collapseR  = 8;
    const collapseX  = X_CASE + CASE_W + 14;
    const collapseY  = caseCY;
    const collapseBtn = svgEl('g', { class: 'collapse-btn', style: 'cursor:pointer' });
    // 透明热区：从用例右边缘延伸到折叠按钮，确保 hover 不断开
    const hitArea = svgEl('rect', {
      x: X_CASE + CASE_W - 4, y: collapseY - collapseR - 4,
      width: collapseX - X_CASE - CASE_W + collapseR + 8,
      height: collapseR * 2 + 8,
      fill: 'transparent', 'pointer-events': 'all',
    });
    collapseBtn.appendChild(hitArea);
    const collapseBg = svgEl('circle', {
      cx: collapseX, cy: collapseY, r: collapseR,
      fill: '#fff', stroke: '#4096FF', 'stroke-width': 1.5,
    });
    const collapseTxt = svgEl('text', {
      x: collapseX, y: collapseY,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 14, fill: '#4096FF', 'font-weight': 700,
      'pointer-events': 'none',
    });
    collapseTxt.textContent = '−';
    collapseBtn.appendChild(collapseBg);
    collapseBtn.appendChild(collapseTxt);
    caseG.appendChild(collapseBtn);
    nodeLayer.appendChild(caseG);

    // 模块根节点 → 用例节点连接线
    drawConnector(lineLayer,
      moduleAnchors.right, moduleAnchors.cy,
      X_CASE, caseCY
    );

    // 子节点 group（可折叠）
    const childG = svgEl('g', { class: 'case-children' });
    const childLineG = svgEl('g', { class: 'case-child-lines' });
    lineLayer.appendChild(childLineG);
    nodeLayer.appendChild(childG);

    // 折叠状态
    let collapsed = false;
    collapseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      collapsed = !collapsed;
      childG.setAttribute('display', collapsed ? 'none' : '');
      childLineG.setAttribute('display', collapsed ? 'none' : '');
      collapseTxt.textContent = collapsed ? '+' : '−';
      // 折叠后常显按钮，展开后恢复 hover 触发
      if (collapsed) collapseBtn.classList.add('expanded');
      else collapseBtn.classList.remove('expanded');
    });
    // hover 用例节点时显示折叠按钮
    caseG.addEventListener('mouseenter', () => {
      collapseBtn.style.opacity = '1';
    });
    caseG.addEventListener('mouseleave', () => {
      if (!collapsed) collapseBtn.style.opacity = '';
    });
    collapseBg.addEventListener('mouseenter', () => {
      collapseBg.setAttribute('fill', '#E6F4FF');
    });
    collapseBg.addEventListener('mouseleave', () => {
      collapseBg.setAttribute('fill', '#fff');
    });

    // ── 动态列位置（无前置条件时步骤前移缩紧）──
    const hasPrereq = !!prereq;
    const hasSteps = steps.length > 0;
    const stepX = hasPrereq ? X_STEP : X_PREREQ;
    const resultX = stepX + STEP_W + H_GAP;

    // 无子节点时隐藏折叠按钮
    if (!hasPrereq && !hasSteps) {
      collapseBtn.setAttribute('display', 'none');
    }

    // ── 前置条件节点 ──
    let prereqAnchors = null;
    if (hasPrereq) {
      const prereqNodeG = svgEl('g', {
        'data-case-id': c.id || '',
        'data-field': 'prereq',
      });
      prereqAnchors = drawNode(
        prereqNodeG, X_PREREQ, caseCY, PREREQ_W,
        prereq, 'prereq', prereq, ''
      );
      bindEditDblClick(prereqNodeG, c, 'prereq', -1, prereq, prereqAnchors);
      bindSelectable(prereqNodeG, c, 'prereq', -1, prereqAnchors);
      childG.appendChild(prereqNodeG);
      drawConnector(childLineG,
        caseCoreAnchors.right, caseCoreAnchors.cy,
        prereqAnchors.left, prereqAnchors.cy
      );
    }

    // ── 步骤 + 预期结果（支持多行预期结果）──
    if (hasSteps) {
      let rowOffset = 0;
      steps.forEach((step, si) => {
        const stepText   = step.desc || step.description || '';
        const resultText = step.result || step.expected || '';
        const resultLines = resultText ? resultText.split('\n').filter(l => l.trim()) : [];
        const numResultRows = Math.max(1, resultLines.length);

        // 步骤节点：垂直居中于该步骤的所有预期结果行
        const stepStartY = curY + rowOffset * ROW_HEIGHT;
        const stepCY = stepStartY + (numResultRows - 1) * ROW_HEIGHT / 2;

        const stepNodeG = svgEl('g', {
          'data-case-id':   c.id || '',
          'data-step-index': si,
          'data-field': 'step',
        });
        const stepAnchors = drawNode(
          stepNodeG, stepX, stepCY, STEP_W,
          stepText, 'step', stepText, ''
        );
        bindEditDblClick(stepNodeG, c, 'step', si, stepText, stepAnchors);
        bindSelectable(stepNodeG, c, 'step', si, stepAnchors);
        childG.appendChild(stepNodeG);

        // 连接线：prereq/case → step
        const srcAnchors = prereqAnchors || caseCoreAnchors;
        drawConnector(childLineG,
          srcAnchors.right, srcAnchors.cy,
          stepAnchors.left, stepAnchors.cy
        );

        // 预期结果节点（每行独立渲染）
        resultLines.forEach((line, ri) => {
          const resultCY = stepStartY + ri * ROW_HEIGHT;
          const resultNodeG = svgEl('g', {
            'data-case-id':    c.id || '',
            'data-step-index':   si,
            'data-result-index': ri,
            'data-field': 'result',
          });
          const resultAnchors = drawNode(
            resultNodeG, resultX, resultCY, RESULT_W,
            line, 'result', line, ''
          );
          bindEditDblClick(resultNodeG, c, 'result', si, line, resultAnchors, ri);
          bindSelectable(resultNodeG, c, 'result', si, resultAnchors, ri);
          childG.appendChild(resultNodeG);
          drawConnector(childLineG,
            stepAnchors.right, stepAnchors.cy,
            resultAnchors.left, resultAnchors.cy
          );
        });

        rowOffset += numResultRows;
      });
    }

    // 下一个用例的起始 Y
    curY += rows * ROW_HEIGHT + CASE_GAP;
  });

  // ── 模块根节点 + 按钮 → 新增用例 ──
  const moduleNodeG = nodeLayer.querySelector('g:first-child') || nodeLayer.firstChild;
  if (moduleNodeG) {
    bindSelectable(moduleNodeG, { id: '__module__' }, 'module', -1, moduleAnchors);
  }

  // 首次加载时重置缩放，增删改后保持当前缩放
  if (resetScale) applyScale(1.0, false);
  else applyScale(scale, false);
}

/* ════════════════════════════════════════════════════════
   用例拖拽排序
════════════════════════════════════════════════════════ */
let dragState = null;
let dragIndicator = null;

function startCaseDrag(caseIndex, startCY, e) {
  const svgRect = $svg.getBoundingClientRect();
  dragState = {
    caseIndex,
    startY: e.clientY,
    casePositions: [],
  };

  // Calculate Y positions of all cases
  let curY = PADDING + NODE_H / 2;
  currentCases.forEach((c, i) => {
    const rows = calcCaseRows(c);
    const blockH = rows * ROW_HEIGHT;
    const caseCY = curY + (blockH - ROW_HEIGHT) / 2;
    dragState.casePositions.push({ index: i, cy: caseCY, top: curY, bottom: curY + blockH });
    curY += rows * ROW_HEIGHT + CASE_GAP;
  });

  // Create drop indicator line
  dragIndicator = svgEl('line', {
    x1: X_CASE - 30, x2: X_CASE + CASE_W + 30,
    y1: 0, y2: 0,
    stroke: '#4096FF', 'stroke-width': 2, 'stroke-dasharray': '6,3',
    display: 'none',
  });
  $svg.appendChild(dragIndicator);

  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  const svgRect = $svg.getBoundingClientRect();
  const mouseY = (e.clientY - svgRect.top + $canvasScroll.scrollTop) / scale;

  // Find insert position
  let insertIdx = dragState.casePositions.length;
  let indicatorY = 0;
  for (let i = 0; i < dragState.casePositions.length; i++) {
    const pos = dragState.casePositions[i];
    if (mouseY < pos.cy) {
      insertIdx = i;
      indicatorY = pos.top - CASE_GAP / 2;
      break;
    }
  }
  if (insertIdx === dragState.casePositions.length) {
    const last = dragState.casePositions[dragState.casePositions.length - 1];
    indicatorY = last.bottom + CASE_GAP / 2;
  }

  dragState.insertIdx = insertIdx;
  dragIndicator.setAttribute('y1', indicatorY);
  dragIndicator.setAttribute('y2', indicatorY);
  dragIndicator.setAttribute('display', '');
}

async function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);

  if (dragIndicator) {
    dragIndicator.remove();
    dragIndicator = null;
  }

  if (!dragState) return;

  const fromIdx = dragState.caseIndex;
  const toIdx = dragState.insertIdx;
  dragState = null;

  if (toIdx === undefined || toIdx === fromIdx || toIdx === fromIdx + 1) return;

  const projectId = PROJECT_MAP_JS[currentProject];
  if (!projectId) return;

  const moveCase = currentCases[fromIdx];
  if (!moveCase) return;

  // Determine target and mode
  let targetId, moveMode;
  if (toIdx === 0) {
    // Moving to the very top: place BEFORE the first case
    targetId = currentCases[0].id;
    moveMode = 'BEFORE';
  } else if (toIdx >= currentCases.length) {
    // Moving to the very bottom: place AFTER the last case
    targetId = currentCases[currentCases.length - 1].id;
    moveMode = 'AFTER';
  } else {
    // Moving before the case at toIdx
    targetId = currentCases[toIdx].id;
    moveMode = 'BEFORE';
  }

  try {
    await apiFetch('/api/cases/drag-sort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projectId, moveId: moveCase.id, targetId, moveMode }),
    });
    // Reload to reflect new order
    if (currentModuleId) await loadCases(currentModuleId, currentModuleName);
  } catch (err) {
    alert('排序失败：' + err.message);
  }
}

/** 绘制节点右侧的 ＋ 圆形按钮 */
function drawInlineAddBtn(anchors, onClick) {
  const r = 10;
  const cx = anchors.right + 16;
  const cy = anchors.cy;
  const g = svgEl('g', { class: 'node-add-btn visible', style: 'cursor:pointer' });
  const circle = svgEl('circle', {
    cx, cy, r,
    fill: '#fff', stroke: '#4096FF', 'stroke-width': 1.5,
  });
  const txt = svgEl('text', {
    x: cx, y: cy,
    'text-anchor': 'middle', 'dominant-baseline': 'middle',
    'font-size': 16, fill: '#4096FF', 'font-weight': 700,
    'pointer-events': 'none',
  });
  txt.textContent = '+';
  g.appendChild(circle);
  g.appendChild(txt);

  g.addEventListener('mouseenter', () => circle.setAttribute('fill', '#E6F4FF'));
  g.addEventListener('mouseleave', () => circle.setAttribute('fill', '#fff'));
  g.addEventListener('click', (e) => {

    onClick();
  });

  // 放入 SVG 的节点层
  const nodeLayer = document.getElementById('nodes');
  if (nodeLayer) nodeLayer.appendChild(g);
  return g;

/**
 * 为节点绑定 click 选中行为
 * 选中后：节点高亮 + 右侧出现 ＋ 按钮 + 键盘 Delete 删除
 *
 * ＋ 按钮的行为取决于 field 类型：
 *   prereq → 在步骤列新增一个步骤
 *   step   → 在预期结果列新增该步骤的预期结果（若已有则新增下一个步骤）
 *   result → 新增下一个步骤
 */
function bindSelectable(nodeG, caseObj, field, stepIdx, anchors, resultIdx) {
  nodeG.style.cursor = 'pointer';
  nodeG.addEventListener('click', (e) => {
    e.stopPropagation();

    // 如果点击的是已选中节点，不重复处理
    if (selectedNode && selectedNode.g === nodeG) return;

    clearSelection();

    // 高亮
    nodeG.classList.add('node-selected');

    // 根据节点类型决定 ＋ 按钮行为（只读模式无 + 按钮）
    let addAction;
    if (isReadonly) {
      // 只读模式：不显示任何 + 按钮
    } else if (field === 'module') {
      // 模块根节点 ＋ → 新增用例
      addAction = async () => {
        const result = await createNewCase('新用例');
        // 新用例加入本地数据后重渲染
        if (result && result.data) {
          currentCases.push({ id: result.data.id || result.data, name: '新用例', steps: [{ id: '1', num: 1, desc: '步骤 1', result: '预期结果' }], prerequisite: '' });
        }
        // 通过 API 重新拉取以获取完整数据
        if (currentModuleId) loadCases(currentModuleId, currentModuleName);
      };
    } else if (field === 'case' || field === 'prereq') {
      // 用例节点 / 前置条件右侧 ＋ → 新增步骤
      addAction = async () => {
        const stepsArr = parseSteps(caseObj.steps);
        stepsArr.push({ id: String(stepsArr.length + 1), num: stepsArr.length + 1, desc: '新步骤', result: '预期结果' });
        await patchCaseSteps(caseObj, stepsArr);
        reloadCurrentModule();
      };
    } else if (field === 'step') {
      // 步骤右侧 ＋ → 为该步骤新增预期结果
      addAction = async () => {
        const arr = parseSteps(caseObj.steps);
        if (arr[stepIdx]) {
          const existing = arr[stepIdx].result || '';
          arr[stepIdx].result = existing ? existing + '\n新预期结果' : '新预期结果';
        }
        await patchCaseSteps(caseObj, arr);
        reloadCurrentModule();
      };
    }
    // result 节点不显示 ＋ 按钮

    const addBtnG = addAction ? drawInlineAddBtn(anchors, addAction) : null;

    selectedNode = { g: nodeG, caseObj, field, stepIdx, anchors, addBtnG, resultIdx };
  });
}

/** 键盘 Delete/Backspace 删除选中节点 */
document.addEventListener('keydown', async (e) => {
  if (isReadonly) return;  // 只读模式禁用删除
  if (!selectedNode) return;
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  // 如果正在编辑（contenteditable 或 input），不拦截
  const active = document.activeElement;
  if (active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

  e.preventDefault();
  const { caseObj, field, stepIdx } = selectedNode;

  try {
    if (field === 'case' || field === 'caseName') {
      // 删除整条用例
      const confirmed = await showConfirm(`确认删除用例「${caseObj.name}」？\n删除后可在回收站恢复。`);
      if (!confirmed) return;
      await apiFetch(`/api/cases/${caseObj.id}`, { method: 'DELETE' });
      // 从本地数据中移除
      const idx = currentCases.findIndex(c => c.id === caseObj.id);
      if (idx >= 0) currentCases.splice(idx, 1);
    } else if (field === 'prereq') {
      // 删除前置条件
      await apiFetch(`/api/cases/${caseObj.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prerequisite: '' }),
      });
    } else if (field === 'step') {
      // 删除整个步骤（含预期结果）
      const arr = parseSteps(caseObj.steps);
      arr.splice(stepIdx, 1);
      arr.forEach((s, i) => { s.id = String(i + 1); s.num = i + 1; });
      await patchCaseSteps(caseObj, arr);
    } else if (field === 'result') {
      // 删除该行预期结果
      const arr = parseSteps(caseObj.steps);
      if (arr[stepIdx]) {
        const ri = selectedNode.resultIdx;
        const lines = (arr[stepIdx].result || '').split('\n').filter(l => l.trim());
        if (ri != null && lines.length > 1) {
          lines.splice(ri, 1);
          arr[stepIdx].result = lines.join('\n');
        } else {
          arr[stepIdx].result = '';
        }
      }
      await patchCaseSteps(caseObj, arr);
    }
    clearSelection();
    reloadCurrentModule();
  } catch (err) {
    alert('删除失败：' + err.message);
  }
});

      headers: { 'Content-Type': 'application/json' },

}

/**
 * 为节点绑定双击编辑事件（prereq / step / result）
 * @param {SVGElement} nodeG    - 节点 g 元素
 * @param {Object}     caseObj  - 用例对象（含 id, steps, prerequisite）
 * @param {string}     field    - 'prereq' | 'step' | 'result'
 * @param {number}     stepIdx  - 步骤下标（prereq 传 -1）
 * @param {string}     origText - 原始完整文字
 * @param {Object}     anchors  - { top, left, right, cy } 节点坐标
 */
function bindEditDblClick(nodeG, caseObj, field, stepIdx, origText, anchors, resultIdx) {
  nodeG.style.cursor = 'pointer';
  nodeG.addEventListener('dblclick', (e) => {
    e.stopPropagation();

    openInlineEditor(nodeG, caseObj, field, stepIdx, origText, anchors, resultIdx);
  });
