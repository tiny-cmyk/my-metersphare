/**
 * 在节点位置叠加 HTML contenteditable 编辑框
 */
function openInlineEditor(nodeG, caseObj, field, stepIdx, origText, anchors, resultIdx) {
  // 移除已有编辑框
  document.querySelectorAll('.inline-editor').forEach(el => el.remove());

  // 用 SVG 元素屏幕坐标 + scroll 容器偏移，精确定位编辑框
  const nodeRect   = nodeG.getBoundingClientRect();
  const scrollRect = $canvasScroll.getBoundingClientRect();
  const edLeft = nodeRect.left - scrollRect.left + $canvasScroll.scrollLeft;
  const edTop  = nodeRect.top  - scrollRect.top  + $canvasScroll.scrollTop;
  const nodeW  = nodeRect.width;
  const nodeH  = nodeRect.height;

  const editor = document.createElement('div');
  editor.className = 'inline-editor';
  editor.contentEditable = 'true';
  editor.textContent = origText;
  editor.style.cssText = [
    `position:absolute`,
    `left:${edLeft}px`,
    `top:${edTop}px`,
    `width:${nodeW}px`,
    `min-height:${nodeH}px`,
    `background:#fff`,
    `border:2px solid #4096FF`,
    `border-radius:4px`,
    `font-size:13px`,
    `padding:4px`,
    `z-index:200`,
    `outline:none`,
    `white-space:pre-wrap`,
    `word-break:break-all`,
    `line-height:1.4`,
    `cursor:text`,
  ].join(';');

  $canvasScroll.appendChild(editor);
  editor.focus();

  // 选中全文
  const range = document.createRange();
  range.selectNodeContents(editor);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);

  let committed = false;

  // 提交编辑
  async function commitEdit() {
    if (committed) return;
    committed = true;
    const newText = editor.textContent.trim();
    editor.remove();
    if (newText === origText) return;

    // 构造 PATCH body
    let body = {};
    if (field === 'caseName') {
      body = { name: newText };
    } else if (field === 'prereq') {
      body = { prerequisite: newText };
    } else {
      // 更新 steps 数组
      const steps = parseSteps(caseObj.steps);
      if (field === 'step') {
        if (steps[stepIdx]) steps[stepIdx].desc = newText;
      } else if (field === 'result') {
        if (steps[stepIdx]) {
          if (resultIdx != null) {
            const lines = (steps[stepIdx].result || '').split('\n').filter(l => l.trim());
            lines[resultIdx] = newText;
            steps[stepIdx].result = lines.join('\n');
          } else {
            steps[stepIdx].result = newText;
          }
        }
      }
      body = { steps };
    }

    try {
      await apiFetch(`/api/cases/${caseObj.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      // 更新内存中的用例对象
      if (field === 'caseName') {
        caseObj.name = newText;
      } else if (field === 'prereq') {
        caseObj.prerequisite = newText;
      } else {
        const steps = parseSteps(caseObj.steps);
        if (field === 'step' && steps[stepIdx]) steps[stepIdx].desc = newText;
        if (field === 'result' && steps[stepIdx]) {
          if (resultIdx != null) {
            const lines = (steps[stepIdx].result || '').split('\n').filter(l => l.trim());
            lines[resultIdx] = newText;
            steps[stepIdx].result = lines.join('\n');
          } else {
            steps[stepIdx].result = newText;
          }
        }
        caseObj.steps = steps;
      }

      // 更新完直接重渲染（确保布局和文字都正确）
      reloadCurrentModule();
    } catch (err) {
      console.error('保存失败：', err);
      alert('保存失败：' + err.message);
    }
  }

  // 取消编辑
  function cancelEdit() {
    if (committed) return;
    committed = true;
    editor.remove();
  }

  editor.addEventListener('blur', commitEdit);
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      commitEdit();
    } else if (e.key === 'Escape') {
      cancelEdit();
    }
  });
}

/* ════════════════════════════════════════════════════════
   缩放与平移
════════════════════════════════════════════════════════ */

function applyScale(newScale, showHint = true) {
  scale = Math.min(2.0, Math.max(0.5, newScale));
  $svg.style.transform = `scale(${scale})`;
  // 更新 SVG 容器的实际占用尺寸（让滚动条正常）
  const w = parseFloat($svg.getAttribute('width') || 0);
  const h = parseFloat($svg.getAttribute('height') || 0);
  $svg.style.width  = (w * scale) + 'px';
  $svg.style.height = (h * scale) + 'px';
  $svg.style.transformOrigin = '0 0';
  if (showHint) showZoomHint(scale * 100);
}

// Ctrl + 滚轮缩放
$canvasScroll.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    applyScale(scale + delta);
  }
}, { passive: false });

// 鼠标拖拽平移
let isDragging = false, dragStartX = 0, dragStartY = 0, scrollStartX = 0, scrollStartY = 0;

$canvasScroll.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  scrollStartX = $canvasScroll.scrollLeft;
  scrollStartY = $canvasScroll.scrollTop;
  $canvasScroll.classList.add('grabbing');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  $canvasScroll.scrollLeft = scrollStartX - (e.clientX - dragStartX);
  $canvasScroll.scrollTop  = scrollStartY - (e.clientY - dragStartY);
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  $canvasScroll.classList.remove('grabbing');
});

/* ════════════════════════════════════════════════════════
   Tooltip
════════════════════════════════════════════════════════ */
function showTooltip(e, text) {
  if (!text || !text.trim()) return;  // 空文本不显示 tooltip
  $tooltip.textContent = text;
  $tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const x = e.clientX + 14;
  const y = e.clientY + 10;
  $tooltip.style.left = Math.min(x, window.innerWidth - 340) + 'px';
  $tooltip.style.top  = Math.min(y, window.innerHeight - 80) + 'px';
}
function hideTooltip() { $tooltip.style.display = 'none'; }

/* ════════════════════════════════════════════════════════
   模块树渲染
════════════════════════════════════════════════════════ */

/**
 * 递归渲染模块树节点
 * @param {Array}  nodes   - 树节点数组
 * @param {number} depth   - 缩进层级
 * @param {boolean} isRoot - 是否第一层（默认展开）
 */
function renderTree(nodes, depth, isRoot) {
  if (!nodes || nodes.length === 0) return document.createDocumentFragment();
  const frag = document.createDocumentFragment();

  nodes.forEach(node => {
    const hasChildren = node.children && node.children.length > 0;
    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    const item = document.createElement('div');
    item.className = 'tree-item' + (isRoot && hasChildren ? ' expanded' : '');
    item.style.paddingLeft = (14 + depth * 16) + 'px';
    item.dataset.id = node.id;

    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    toggle.textContent = hasChildren ? '▶' : '';
    item.appendChild(toggle);

    const nameEl = document.createElement('span');
    nameEl.className = 'node-name';
    nameEl.textContent = node.name;
    nameEl.title = node.name;
    item.appendChild(nameEl);

    wrapper.appendChild(item);

    // 子节点容器
    let childrenEl = null;
    if (hasChildren) {
      childrenEl = document.createElement('div');
      childrenEl.className = 'tree-children' + (isRoot ? ' open' : '');
      childrenEl.appendChild(renderTree(node.children, depth + 1, false));
      wrapper.appendChild(childrenEl);
    }

    // 点击：展开/收起 + 加载用例
    item.addEventListener('click', (e) => {
      e.stopPropagation();

      // 选中高亮
      document.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
      item.classList.add('active');

      // 展开/收起子节点
      if (hasChildren) {
        const expanded = item.classList.toggle('expanded');
        childrenEl.classList.toggle('open', expanded);
      }

      // 加载该节点的用例
      loadCases(node.id, node.name);
    });

    frag.appendChild(wrapper);
  });
  return frag;
}

/* ════════════════════════════════════════════════════════
   数据加载
════════════════════════════════════════════════════════ */

/** 初始化：加载项目列表 */
async function initProjects() {
  try {
    const projects = await apiFetch('/api/projects');
    $projectSelect.innerHTML = '';
    projects.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      $projectSelect.appendChild(opt);
    });
    if (projects.length > 0) {
      currentProject = projects[0];
      await loadModules(currentProject);
    }
  } catch (e) {
    showError('加载项目列表失败：' + e.message, initProjects);
  }
}

/** 加载模块树 */
async function loadModules(project) {
  showLoading('加载模块树…');
  $moduleTree.innerHTML = '';
  currentModuleId = '';
  currentModuleName = '';
  currentCases = [];
  renderMindmap([], '');
  $placeholder.style.display = '';
  $placeholder.querySelector('div:last-child').textContent = '请在左侧选择一个模块';

  try {
    const modules = await apiFetch(`/api/modules?project=${encodeURIComponent(project)}`);
    hideLoading();
    cachedModuleTree = modules || [];
    if (!modules || modules.length === 0) {
      $moduleTree.innerHTML = '<div class="empty-tip">暂无模块</div>';
      return;
    }
    $moduleTree.appendChild(renderTree(modules, 0, true));
  } catch (e) {
    hideLoading();
    showError('加载模块树失败：' + e.message, () => loadModules(project));
  }
}

/** 加载指定模块的用例并渲染脑图 */
async function loadCases(moduleId, moduleName, silent = false) {
  if (!currentProject) return;
  currentModuleId = moduleId;
  if (moduleName) currentModuleName = moduleName;  // 记录当前模块名

  if (!silent) showLoading(`加载「${moduleName}」用例…`);

  try {
    const cases = await apiFetch(
      `/api/cases?project=${encodeURIComponent(currentProject)}&moduleId=${encodeURIComponent(moduleId)}`
    );
    if (!silent) hideLoading();
    hideError();

    if (!silent) {
      currentCases = cases || [];
      const mod = findModuleById(cachedModuleTree, moduleId);

      if (currentCases.length === 0 && mod && mod.children && mod.children.length > 0) {
        // 有子模块无用例 → 展示模块地图
        renderModuleMap(mod, mod.children);
      } else {
        // 统一用树视图样式展示用例
        expandedCasesCache[moduleId] = currentCases;
        expandedModules.add(moduleId);
        // 构造一个包含该模块的树视图
        const leafMod = mod || { id: moduleId, name: moduleName || currentModuleName, children: [] };
        renderModuleMap({ name: moduleName || currentModuleName }, [leafMod]);
      }
    } else {
      // 静默刷新：对比 updateTime，如有变更则重新渲染
      const newCases = cases || [];
      const changed = hasChanged(currentCases, newCases);
      if (changed) {
        currentCases = newCases;
        expandedCasesCache[moduleId] = currentCases;
        // 如果当前在树视图中，刷新树视图
        if (_moduleMapParent && _moduleMapChildren) {
          renderModuleMap(_moduleMapParent, _moduleMapChildren, false);
        } else {
          const mod = findModuleById(cachedModuleTree, moduleId);
          const leafMod = mod || { id: moduleId, name: currentModuleName, children: [] };
          renderModuleMap({ name: currentModuleName }, [leafMod], false);
        }
        flashRefreshDot();
      }
    }
  } catch (e) {
    if (!silent) {
      hideLoading();
      showError('加载用例失败：' + e.message, () => loadCases(moduleId, moduleName));
    }
  }
}

/** 检测用例列表是否有变更（对比 updateTime + 数量） */
function hasChanged(oldCases, newCases) {
  if (oldCases.length !== newCases.length) return true;
  const oldMap = new Map(oldCases.map(c => [c.id, c.updateTime || c.updateUser]));
  return newCases.some(c => oldMap.get(c.id) !== (c.updateTime || c.updateUser));
}

/** 刷新指示器闪烁 */
function flashRefreshDot() {
  $refreshDot.classList.remove('pulse');
  void $refreshDot.offsetWidth;  // reflow 触发重播
  $refreshDot.classList.add('pulse');
}

/* ════════════════════════════════════════════════════════
   自动刷新（30 秒轮询）
════════════════════════════════════════════════════════ */
function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => {
    if (currentModuleId) {
      loadCases(currentModuleId, '', true);  // 静默刷新
    }
  }, 30000);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

/* ════════════════════════════════════════════════════════
   交互事件绑定
════════════════════════════════════════════════════════ */

// 侧栏展开/收起
$toggleBtn.addEventListener('click', () => {
  const collapsed = $sidebar.classList.toggle('collapsed');
  $toggleBtn.textContent = collapsed ? '▶' : '◀';
});

// 全屏
$btnFullscreen.addEventListener('click', () => {
  const isActive = $btnFullscreen.classList.toggle('fullscreen-active');
  if (isActive) {
    $sidebar.classList.add('collapsed');
    $toggleBtn.textContent = '▶';
  } else {
    $sidebar.classList.remove('collapsed');
    $toggleBtn.textContent = '◀';
  }
  $btnFullscreen.textContent = isActive ? '⛶ 退出全屏' : '⛶ 全屏';
});

// 手动刷新
$btnRefresh.addEventListener('click', () => {
  if (currentModuleId) {
    // 找到当前选中节点的名字
    const activeItem = document.querySelector('.tree-item.active');
    const name = activeItem ? activeItem.querySelector('.node-name').textContent : '';
    loadCases(currentModuleId, name);
  }
});

// 重试按钮
$btnRetry.addEventListener('click', () => {
  hideError();
  if (lastRetryAction) lastRetryAction();
});

// 项目切换
$projectSelect.addEventListener('change', () => {
  currentProject = $projectSelect.value;
  stopAutoRefresh();
  loadModules(currentProject).then(() => startAutoRefresh());
});

/* ════════════════════════════════════════════════════════
   启动
════════════════════════════════════════════════════════ */
/** 解析 URL 参数 */
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    project: params.get('project') || '',
    moduleId: params.get('moduleId') || '',
    moduleName: params.get('moduleName') || '',
    embedded: params.get('embedded') === '1',
    readonly: params.get('readonly') === '1',
  };
}

/** 全局只读标志（readonly=1 时禁用所有编辑功能） */
let isReadonly = false;

/** 在模块树中查找并点击指定 moduleId 的节点，同时展开其祖先 */
function expandAndClickModule(moduleId) {
  if (!moduleId) return;
  const items = $moduleTree.querySelectorAll('.tree-item');
  for (const item of items) {
    if (item.dataset.id === moduleId) {
      // 展开所有祖先节点
      let parent = item.closest('.tree-children');
      while (parent) {
        parent.classList.add('open');
        const siblingItem = parent.previousElementSibling;
        if (siblingItem && siblingItem.classList.contains('tree-item')) {
          siblingItem.classList.add('expanded');
        }
        parent = parent.parentElement?.closest('.tree-children');
      }
      // 点击该节点
      item.click();
      return;
    }
  }
}

(async () => {
  const urlParams = getUrlParams();

  // 嵌入模式：隐藏 header 和侧栏
  if (urlParams.embedded) {
    document.body.classList.add('embedded');
  }
  // 只读模式
  if (urlParams.readonly) {
    isReadonly = true;
  }

  await initProjects();

  // URL 指定项目：自动选择
  if (urlParams.project && $projectSelect.querySelector(`option[value="${urlParams.project}"]`)) {
    $projectSelect.value = urlParams.project;
    currentProject = urlParams.project;
    await loadModules(currentProject);
  }

  // URL 指定模块：嵌入模式直接加载用例，独立模式展开树节点
  if (urlParams.moduleId && urlParams.moduleId !== 'all') {
    if (urlParams.embedded) {
      loadCases(urlParams.moduleId, urlParams.moduleName);
    } else {
      expandAndClickModule(urlParams.moduleId);
    }
  }

  startAutoRefresh();
  console.log('%c🗺 MeterSphere 脑图查看器', 'font-size:16px;color:#4096FF;font-weight:bold;');
  console.log('提示：Ctrl + 滚轮 缩放画布，拖拽平移，点击左侧模块加载用例');
})();
</script>
